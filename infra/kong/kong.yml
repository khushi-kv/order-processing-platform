# Kong 3 declarative config (DB-less).
# Routes only for now; JWT, rate limiting, CORS and correlation ID are added on Day 7.
_format_version: "3.0"

services:
  - name: user-service
    url: http://host.docker.internal:8081
    routes:
      - name: auth-route
        paths: [/api/auth]
        strip_path: false
      - name: users-route
        paths: [/api/users]
        strip_path: false

  - name: product-service
    url: http://host.docker.internal:8082
    routes:
      # Public catalogue reads
      - name: products-read-route
        paths: [/api/products]
        methods: [GET]
        strip_path: false
      # Admin writes; JWT plugin attaches here on Day 7
      - name: products-write-route
        paths: [/api/products]
        methods: [POST, PUT, DELETE]
        strip_path: false

  - name: order-service
    url: http://host.docker.internal:8083
    routes:
      - name: orders-route
        paths: [/api/orders, /api/admin/orders]
        strip_path: false

  - name: payment-service
    url: http://host.docker.internal:8084
    routes:
      - name: payments-route
        paths: [/api/payments]
        strip_path: false
