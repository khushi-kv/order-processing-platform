server:
  port: 8081

spring:
  application:
    name: auth-service
  config:
    import: optional:file:.env
  datasource:
    url: jdbc:postgresql://localhost:5432/order_platform_db
    username: admin
    password: admin
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
