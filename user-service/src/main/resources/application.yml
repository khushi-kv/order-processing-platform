server:
  port: 8081

spring:
  application:
    name: user-service
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/user_db
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:admin}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    # No default: the service refuses to start without a secret
    secret: ${JWT_SECRET}
    issuer: order-platform
    expiration: 1h

management:
  endpoints:
    web:
      exposure:
        include: health,info
